
##
## M19.a CI pipeline — lint + typecheck + unit tests + build
## Runs on every push to main / opc_v2 and on PRs.
##
name: CI

on:
  push:
    branches: [main, opc_v2]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      ## Build shared/memory-store first (dependency of all MCP servers)
      - run: pnpm --filter @opc/memory-store build
      - run: pnpm --filter @opc/tool-aliases build

      ## Build state-server next (dependency of orchestrator)
      - run: pnpm --filter @opc/state-server build
      - run: pnpm --filter @opc/knowledge-server build
      - run: pnpm --filter @opc/reflection-server build

      ## Build orchestrator (depends on all three servers)
      - run: pnpm --filter @opc/orchestrator build

      ## Typecheck all packages
      - run: pnpm run typecheck --if-present

      ## Unit + integration tests
      - run: npx vitest run --reporter=basic

      ## Verify CLI binary is executable
      - run: |
          node platform/opc-orchestrator/bin/opc-status.mjs --help
          echo "opc-status CLI --help exit ok"

      ## Verify CLI returns error for nonexistent root (not a CI failure — expected)
      - run: |
          node platform/opc-orchestrator/bin/opc-status.mjs --root /nonexistent 2>&1 || true
          echo "opc-status handles missing root gracefully"
